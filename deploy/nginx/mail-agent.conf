# ==============================================================================
# Mail Agent — Nginx Reverse Proxy Configuration (VPS 103.147.123.63)
# Domain: mail-agent.wrydeco.com -> 127.0.0.1:8090
# Critical: Does NOT interfere with port 25/465/587/993 (mailserver), 8089 (SnappyMail), 8088 (Roundcube)
# Invariant R-33: Single published port 127.0.0.1:8090
# ==============================================================================

# HTTP Server — ACME Challenge & SSL Redirection
server {
    listen 80;
    listen [::]:80;
    server_name mail-agent.wrydeco.com;

    # Let's Encrypt ACME challenge webroot directory
    location /.well-known/acme-challenge/ {
        root /var/www/mail-agent-acme;
        try_files $uri =404;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server — Production Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mail-agent.wrydeco.com;

    # SSL Certificates (managed via certbot webroot)
    ssl_certificate /etc/letsencrypt/live/mail-agent.wrydeco.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail-agent.wrydeco.com/privkey.pem;

    # TLS Protocol Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:mail_agent_SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self';" always;

    # Request size limits (allows attachments up to 25MB)
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Root reverse proxy to FastAPI / Frontend bundle container
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        # WebSocket / Connection upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        # Forwarded client headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # SSE / Streaming Endpoints (LLM generation, event streams)
    location ~* ^/api/(generation|events|logs)/stream {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        # Critical for SSE: disable buffering and cache
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Long-lived SSE connection timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health probes bypassing auth and caching
    location ~* ^/health/(live|ready) {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache off;
        access_log off;
    }
}
